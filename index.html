<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <h1>Task<span>Flow</span></h1>
        
        <input type="text" id="search-input" placeholder="Buscar tareas..." class="search-bar">
        
        <div class="user-profile">JH</div>
    </header>

    <main class="app-container">
        
        <aside class="sidebar">
            <nav>
                <ul>
                    <li id="filter-all" class="active">📅 Todas</li>
                    <li id="filter-urgent">🔥 Urgentes</li>
                    <li id="filter-completed">✅ Finalizadas</li>
                </ul>
            </nav>
        </aside>

        <section class="task-board">
            <div class="board-header">
                <h2>Panel de Control</h2>
                <span id="task-count">0 tareas pendientes</span>
            </div>
            
            <form id="task-form" class="add-task-container">
                <input type="text" id="task-input" placeholder="¿Qué hay que hacer hoy?" required>
                <button type="submit" id="add-btn">Añadir</button>
            </form>

            <div id="task-list" class="task-list">
                </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
