<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Gestor de Tareas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 TaskFlow <span class="pro-badge">PRO</span></h1>
            <div class="stats-bar">
                <div class="stat-item">Tareas: <span id="pendingCount">0</span></div>
            </div>
        </header>

        <main>
            <form id="taskForm" class="task-form">
                <input type="text" id="taskInput" placeholder="¿Qué hay que hacer?" required>
                <select id="taskPriority">
                    <option value="Baja">Baja</option>
                    <option value="Media" selected>Media</option>
                    <option value="Alta">Alta</option>
                </select>
                <button type="submit">Añadir</button>
            </form>

            <ul id="taskList" class="task-list"></ul>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
