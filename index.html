<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Tailwind Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuración de Tailwind para permitir modo oscuro por clase
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">
    
    <div class="max-w-xl mx-auto py-12 px-4">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">🚀 TaskFlow <span class="text-xs bg-indigo-100 dark:bg-indigo-900 px-2 py-1 rounded">PRO</span></h1>
            <button id="themeToggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:ring-2 ring-indigo-500 transition-all">
                <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
            </button>
        </header>

        <main class="bg-white dark:bg-slate-800 shadow-xl rounded-2xl p-6">
            <form id="taskForm" class="space-y-4 mb-8">
                <div class="flex flex-col md:flex-row gap-2">
                    <input type="text" id="taskInput" placeholder="¿Qué hay que hacer?" required 
                        class="flex-1 p-3 border rounded-lg dark:bg-slate-700 dark:border-slate-600 focus:ring-2 ring-indigo-500 outline-none">
                    <select id="taskPriority" class="p-3 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
                        <option value="Baja">Baja</option>
                        <option value="Media" selected>Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                        Añadir
                    </button>
                </div>
            </form>

            <div class="flex justify-between items-center mb-4 text-sm font-medium text-slate-500">
                <span>Tareas: <span id="pendingCount" class="text-indigo-600">0</span></span>
            </div>

            <ul id="taskList" class="divide-y divide-slate-100 dark:divide-slate-700">
                </ul>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
