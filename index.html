<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Julia Huertas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong class="brand">TaskFlow Pro</strong></li>
        </ul>
        <ul>
            <li><button id="themeToggle" class="outline contrast" aria-label="Cambiar tema">🌓</button></li>
            <li><progress id="progressBar" value="0" max="100"></progress></li>
        </ul>
    </nav>

    <main class="container">
        <div class="grid">
            <aside>
                <article>
                    <header>Panel de Control</header>
                    <div class="grid">
                        <div><small>Pendientes</small><br><b id="pendingCount">0</b></div>
                        <div><small>Listas</small><br><b id="completedCount">0</b></div>
                    </div>
                    <footer>
                        <label for="priorityFilter">Prioridad</label>
                        <select id="priorityFilter">
                            <option value="all">Todas</option>
                            <option value="High">Alta</option>
                            <option value="Medium">Media</option>
                            <option value="Low">Baja</option>
                        </select>
                    </footer>
                </article>
                <input type="search" id="searchInput" placeholder="Buscar tarea...">
            </aside>

            <section>
                <form id="taskForm">
                    <fieldset role="group">
                        <input type="text" id="taskInput" placeholder="Nueva tarea..." required>
                        <select id="taskPriority">
                            <option value="High">Alta</option>
                            <option value="Medium" selected>Media</option>
                            <option value="Low">Baja</option>
                        </select>
                        <input type="submit" value="Añadir">
                    </fieldset>
                </form>
                <div id="taskList"></div>
            </section>
        </div>
    </main>

    <footer class="container">
        <hr>
        <small>&copy; 2026 Julia Huertas Torres - TaskFlow Project</small>
    </footer>

    <script src="app.js"></script>
</body>
</html>
