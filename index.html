<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <header class="p-4 bg-white dark:bg-slate-900 shadow-sm border-b dark:border-slate-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600 tracking-tighter">TaskFlow</h1>
            
            <div class="flex items-center gap-4">
                <div class="hidden sm:block text-right">
                    <div class="w-32 bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <span id="progress-text" class="text-[10px] uppercase font-bold text-slate-400">0% completado</span>
                </div>
                <button id="theme-toggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:ring-2 ring-indigo-500 transition-all">
                    <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
                </button>
                <button id="open-add-modal" class="sm:hidden bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm">＋ Nueva</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-4 gap-6">
        <aside class="space-y-4">
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border dark:border-slate-800">
                <h2 class="text-xs font-bold uppercase text-slate-400 mb-4 tracking-widest text-center">Resumen de Hoy</h2>
                
                <div class="grid grid-cols-2 gap-2 mb-6 text-center">
                    <div class="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl">
                        <span id="count-pending" class="block text-xl font-bold text-indigo-600">0</span>
                        <span class="text-[9px] uppercase font-bold text-slate-400">Pendientes</span>
                    </div>
                    <div class="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl">
                        <span id="count-done" class="block text-xl font-bold text-green-500">0</span>
                        <span class="text-[9px] uppercase font-bold text-slate-400">Listas</span>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 block">Buscador</label>
                        <input type="text" id="search-input" placeholder="¿Qué buscas?" 
                            class="w-full p-2.5 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 block">Filtrar por Prioridad</label>
                        <select id="filter-priority" class="w-full p-2.5 rounded-xl border dark:bg-slate-800 dark:border-slate-700 outline-none text-sm">
                            <option value="all">Todas las tareas</option>
                            <option value="Alta">Prioridad Alta</option>
                            <option value="Media">Prioridad Media</option>
                            <option value="Baja">Prioridad Baja</option>
                        </select>
                    </div>
                </div>

                <button id="reset-btn" class="w-full mt-8 text-[10px] text-red-400 hover:text-red-600 font-bold uppercase tracking-tight transition-colors">
                    Limpiar datos y reiniciar
                </button>
            </div>
        </aside>

        <section class="md:col-span-3 space-y-4">
            <form id="task-form" class="hidden sm:flex bg-white dark:bg-slate-900 p-3 rounded-2xl shadow-sm border dark:border-slate-800 gap-3">
                <input type="text" id="task-input" placeholder="Añadir una nueva tarea..." required 
                    class="flex-1 p-2 bg-transparent outline-none dark:text-white font-medium">
                <select id="task-priority" class="p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border-none text-sm font-semibold cursor-pointer">
                    <option value="Alta">Alta</option>
                    <option value="Media" selected>Media</option>
                    <option value="Baja">Baja</option>
                </select>
                <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-indigo-700 transition-all active:scale-95 shadow-lg shadow-indigo-200 dark:shadow-none">Añadir</button>
            </form>

            <div id="task-list" class="grid gap-3">
                </div>
        </section>
    </main>

    <div id="modal-add" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl w-full max-w-sm shadow-2xl border dark:border-slate-800">
            <h3 class="text-xl font-bold mb-4">Nueva Tarea</h3>
            <form id="modal-form" class="space-y-4">
                <input type="text" id="modal-input" placeholder="¿Qué tienes pendiente?" required class="w-full p-4 rounded-2xl border dark:bg-slate-800 dark:border-slate-700 focus:ring-2 ring-indigo-500 outline-none">
                <select id="modal-priority" class="w-full p-4 rounded-2xl border dark:bg-slate-800 dark:border-slate-700 outline-none font-semibold">
                    <option value="Alta">Prioridad Alta</option>
                    <option value="Media" selected>Prioridad Media</option>
                    <option value="Baja">Prioridad Baja</option>
                </select>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="close-modal" class="flex-1 p-4 font-bold text-slate-400">Cancelar</button>
                    <button type="submit" class="flex-1 p-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-200 dark:shadow-none">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
