<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow PRO - Gestor de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <nav>
            <h1>TaskFlow <span>PRO</span></h1>
            <button id="themeToggle" title="Cambiar tema">🌓</button>
        </nav>

        <section class="stats">
            <progress id="progressBar" value="0" max="100"></progress>
            <p><span id="pendingCount">0</span> pendientes / <span id="completedCount">0</span> hechas</p>
        </section>

        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="Nueva tarea..." required>
            <select id="taskPriority">
                <option value="Baja">Baja</option>
                <option value="Media" selected>Media</option>
                <option value="Alta">Alta</option>
            </select>
            <button type="submit">Crear</button>
        </form>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Buscar...">
            <select id="priorityFilter">
                <option value="all">Todas</option>
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
        </div>

        <ul id="taskList"></ul>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
