<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TaskFlow</h1>
    </header>

    <main>
        <aside>
            <h3>Filtros</h3>
            <ul>
                <li>Pendientes</li>
                <li>Completadas</li>
            </ul>
        </aside>

        <section class="task-container">
            <h2>Mis Tareas</h2>
            <div class="task-card">
                <span>Tarea Ejemplo</span>
                <span class="badge priority-high">Alta</span>
            </div>
        </section>
    </main>

</body>
</html>
